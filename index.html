<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>هجولة عتابة</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #e0dcf2;
			font: 600 13px 'Segoe UI', system-ui, sans-serif;
			text-decoration: none;
			background: rgba(20, 15, 35, 0.75);
			padding: 10px 20px;
			border-radius: 999px;
			border: 1px solid rgba(139, 95, 191, 0.4);
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(139, 95, 191, 0.2);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			z-index: 20;
			transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.corner-link:hover {
			background: rgba(35, 25, 60, 0.9);
			color: #fff;
			border-color: rgba(91, 140, 255, 0.8);
			box-shadow: 0 6px 24px rgba(91, 140, 255, 0.4);
			transform: translateY(-2px);
		}
		#editor-link { bottom: 12px; right: 12px; }
		#github-link { top: 12px; right: 12px; padding: 8px; line-height: 0; }
		#github-link svg { display: block; width: 20px; height: 20px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<a id="github-link" class="corner-link" href="https://github.com/mrdoob/Starter-Kit-Racing" aria-label="View source on GitHub">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.05c-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.5 3.18-1.18 3.18-1.18.62 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.79.56C20.21 21.39 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
	</a>
	<a id="editor-link" class="corner-link" href="editor.html">إنشاء مضمار جديد</a>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'تعديل هذا المضمار';
		}
	</script>
	<script>
		// Catches failures anywhere in the module graph (main.js or any
		// file it imports) — a top-level error in an imported module
		// stops that whole module from ever running, including any
		// try/catch or error-display code written inside main.js itself,
		// since that code never gets the chance to execute. This plain,
		// non-module script runs independently and can't be blocked the
		// same way, so it's the only reliable place to catch and show
		// these otherwise completely silent failures.
		function showBootError( message, stack ) {

			if ( document.getElementById( 'boot-error-overlay' ) ) return; // only show the first one

			const box = document.createElement( 'div' );
			box.id = 'boot-error-overlay';
			box.dir = 'rtl';
			box.style.cssText = `
				position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column;
				align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
				background: rgba(10,10,14,0.97); font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow-y: auto;
			`;
			box.innerHTML = `
				<div style="color:#fff; font-size:20px; font-weight:700;">تعذّر تشغيل اللعبة</div>
				<div style="color:#ffb4b4; font-size:14px; max-width:90%; direction:ltr; text-align:left;"></div>
				<pre style="color:#9a94b0; font-size:11px; direction:ltr; text-align:left; max-width:90%; max-height:40vh; overflow:auto; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; white-space:pre-wrap;"></pre>
			`;
			box.children[ 1 ].textContent = message;
			box.children[ 2 ].textContent = stack || '';
			document.body.appendChild( box );

		}

		window.addEventListener( 'error', ( e ) => {

			showBootError( e.message || String( e.error ), e.error && e.error.stack );

		} );
		window.addEventListener( 'unhandledrejection', ( e ) => {

			const reason = e.reason;
			showBootError(
				reason && reason.message ? reason.message : String( reason ),
				reason && reason.stack ? reason.stack : ''
			);

		} );
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
